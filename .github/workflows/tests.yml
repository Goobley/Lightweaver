name: SmokeTests

on:
  push:
    branches:
    - mainline
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install pre-commit
      run: python -m pip install pre-commit

    # Runs the hooks from .pre-commit-config.yaml (ruff check and format).
    - name: Run pre-commit hooks
      run: pre-commit run --all-files --show-diff-on-failure

  smoke_tests:
    name: Smoke tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools_scm needs the history to determine the version.
        fetch-depth: 0

    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Build and install
      run: python -m pip install -v . pytest
      env:
        LW_CI_BUILD: true

    - name: Run tests
      # Run from outside the source tree so the installed package is imported.
      working-directory: ${{ runner.temp }}
      run: python -m pytest ${{ github.workspace }}/tests -v --durations=10
